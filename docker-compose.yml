# Local dev database: Postgres with pgvector. Tests can use it too (TEST_DATABASE_URL).
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: flwn
      POSTGRES_PASSWORD: flwn
      POSTGRES_DB: flwn
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
