name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Admin URL: the tests create and drop their own database on this server.
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Tests
        run: python -m unittest discover -s tests -v

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t flwn-data-engine:ci .
      - name: Smoke test
        run: |
          docker run -d --name api -p 8002:8002 \
            -e DATA_API_KEY=ci \
            -e AZURE_FOUNDRY_ENDPOINT=https://example.invalid \
            -e AZURE_FOUNDRY_KEY=ci \
            -e DATABASE_URL=postgresql+psycopg://u:p@localhost/x \
            flwn-data-engine:ci
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8002/healthz && exit 0
            sleep 1
          done
          docker logs api
          exit 1
